name: Ingest hydrometric data (manual)

# The real 5-minute schedule is now Vercel Cron (see vercel.json), running on
# the Pro plan. GitHub Actions' own scheduler proved unreliable for
# high-frequency cron here — in practice it fired roughly once every 5 hours
# instead of every 5 minutes, a documented limitation for frequent schedules
# on lower-traffic repos. This workflow is kept only as a manual "run it now"
# fallback, not as the primary trigger.
on:
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ secrets.INGEST_URL }}"
