name: Ingest hydrometric data

on:
  schedule:
    # Vercel's Hobby plan only allows daily cron jobs, so the 5-minute poll
    # is driven from here instead. GitHub does not guarantee exact timing
    # for scheduled workflows and disables them after 60 days of repo
    # inactivity (a manual run or push re-enables them).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ secrets.INGEST_URL }}"
